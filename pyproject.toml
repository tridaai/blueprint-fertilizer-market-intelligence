[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-fertilizer-market-intelligence"
version = "0.1.0"
description = "Trida AI Blueprint — Fertilizer & Agrochemical Market Intelligence Agent for a fictional Indian farm-input company, Kaveri Agro Inputs (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
# Direct dependencies are pinned EXACTLY (==). The full transitive set is
# frozen in constraints.txt; the pip fallback installs that set first and
# the package itself second (see Makefile, target install-pip).
dependencies = [
    "langgraph==0.6.11",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    # Transitive via langchain-core -> langsmith (websockets>=15.0,
    # unbounded); websockets 17.x requires Python >=3.11, 16.0 does not.
    "websockets==16.0",
    "psycopg[binary]==3.2.9",
    # Provider calls are plain HTTPS; httpx is the one client for them.
    "httpx==0.28.1",
    # Estimation primitives under the in-repo engines (R2+). The engines
    # are stated code in this repo; numpy/pandas are utilities, never a
    # black-box model.
    "numpy==2.2.6",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
fert-agent-demo = "fertilizer_intelligence.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
